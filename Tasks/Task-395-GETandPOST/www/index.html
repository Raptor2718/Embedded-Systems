<html>
<head>
    <title>hello, from Nucleo!</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
            background: #f5f5f7;
            margin: 0;
            height: 100vh;
        }

        .container {
            display: flex;
            gap: 40px;
            padding: 20px;
        }

        h1 {
            margin-bottom: 10px;
            color: #333;
        }

        .panel {
            background: white;
            padding: 20px 30px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            text-align: center;
        }

        input[type="text"] {
            width: 120px;
            padding: 6px;
            border: 1px solid #ccc;
            border-radius: 6px;
            margin-top: 4px;
        }

        input[type="submit"] {
            margin-top: 12px;
            padding: 8px 16px;
            border: none;
            background: #4a90e2;
            color: white;
            border-radius: 6px;
            cursor: pointer;
        }

        input[type="submit"]:hover {
            background: #3a78c2;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="panel">
            <h3>temp</h1>
            <p>{{temp}}</p>
        </div>

        <div class="panel">
            <form action="/" method="GET" autocomplete="off">
                <label for="fname">RED LED:</label><br>
                <input type="checkbox" id="fname" name="red" value="1"><br><br>

                <label for="lname">GREEN LED:</label><br>
                <input type="checkbox" id="lname" name="green" value="1"><br><br>

                <label for="lname">BLUE LED:</label><br>
                <input type="checkbox" id="lname" name="blue" value="1"><br><br>

                <input type="submit" value="Submit">
            </form>
        </div>
    </div>
</body>
</html>
